services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./salas_icci.db:/app/salas_icci.db
      - ./app/static/qr:/app/app/static/qr
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
