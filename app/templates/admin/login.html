{% extends "base.html" %}
{% block title %}Login CEC - Salas ICCI{% endblock %}
{% block body %}
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-sm w-full">
    <div class="text-center mb-6">
      <span class="text-3xl font-bold text-blue-900">CEC-ICCI</span>
      <p class="text-gray-400 text-sm mt-1">Panel de Auditoría</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text" name="username" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="nombre_usuario" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" name="password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">
        Ingresar
      </button>
    </form>
    <a href="/" class="block text-center text-xs text-gray-400 hover:underline mt-4">Volver al inicio</a>
  </div>
</div>
{% endblock %}
