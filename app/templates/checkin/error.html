{% extends "base.html" %}
{% block title %}Error de Acceso{% endblock %}
{% block body %}
<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-red-700 to-red-500 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center">
    <div class="text-6xl mb-4">❌</div>
    <h1 class="text-xl font-bold text-red-700 mb-3">Acceso No Autorizado</h1>
    <p class="text-gray-600 text-sm mb-6">{{ mensaje }}</p>
    <a href="/" class="block w-full bg-red-700 hover:bg-red-600 text-white font-semibold py-3 rounded-xl transition">
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
